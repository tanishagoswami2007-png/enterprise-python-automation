[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-python-automation"
version = "1.0.0"
description = "Automated PDF report generator using a public API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "reportlab>=4.0",
    "schedule>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
enterprise-report = "report_generator.cli:main"

[tool.setuptools.packages.find]
include = ["report_generator*"]
